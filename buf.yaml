# Buf v2 configuration for the grpc-ebcdic protobuf contracts.
#
# Linting runs the full STANDARD category plus COMMENTS, so every file,
# service, rpc, message, field, oneof, enum, and enum value must carry a
# documentation comment. Comment ignores are disallowed: a rule that does not
# fit is a contract to change, not a line to silence.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
    - COMMENTS
  disallow_comment_ignores: true
  ignore_only:
    # The document schema is vendored for parity with the upstream JSON
    # schema (canonical copy in the gRParse repo); its comment coverage
    # follows that schema, not this repo's comment rule.
    COMMENTS:
      - proto/ai/pipestream/document/v1/document.proto
breaking:
  use:
    - FILE
